name: Build Debian package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-deb:
    name: Build architecture-independent package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-bin

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}+git${GITHUB_SHA::7}"
          fi
          dpkg --validate-version "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Debian package
        run: ./packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell-extension-quick-command_${{ steps.version.outputs.version }}_all
          path: dist/*.deb
          if-no-files-found: error

  publish-release:
    name: Publish tagged package
    if: github.ref_type == 'tag'
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: gnome-shell-extension-quick-command_${{ needs.build-deb.outputs.version }}_all
          path: dist

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Quick Command ${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber
